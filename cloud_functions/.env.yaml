# Environment Variables for Google Cloud Functions
# NAD Scanner - Production Configuration

# Stripe Configuration
STRIPE_SECRET_KEY: sk_live_YOUR_SECRET_KEY
STRIPE_WEBHOOK_SECRET: whsec_YOUR_WEBHOOK_SECRET
STRIPE_PUBLISHABLE_KEY: pk_live_YOUR_PUBLISHABLE_KEY

# Google Cloud Configuration
GOOGLE_CLOUD_PROJECT: nadscanner-production
GOOGLE_CLOUD_REGION: us-central1

# Google Drive Configuration
GOOGLE_DRIVE_CREDENTIALS: |
  {
    "type": "service_account",
    "project_id": "nadscanner-production",
    "private_key_id": "YOUR_KEY_ID",
    "private_key": "YOUR_PRIVATE_KEY",
    "client_email": "nadscanner-service@nadscanner-production.iam.gserviceaccount.com",
    "client_id": "YOUR_CLIENT_ID",
    "auth_uri": "https://accounts.google.com/o/oauth2/auth",
    "token_uri": "https://oauth2.googleapis.com/token"
  }
GOOGLE_DRIVE_FOLDER_ID: YOUR_FOLDER_ID

# Database Configuration
DATABASE_URL: sqlite:///nadscanner.db

# Email Configuration (Gmail SMTP)
SMTP_SERVER: smtp.gmail.com
SMTP_PORT: 587
SMTP_USERNAME: your-email@negocioaldia.app
SMTP_PASSWORD: YOUR_APP_PASSWORD
FROM_EMAIL: noreply@negocioaldia.app
FROM_NAME: NAD Scanner - Tu Negocio Al Día

# Local Payment Configuration
PAGOMOVIL_PHONE: 04141234567
PAGOMOVIL_BANK: Banco de Venezuela
ZELLE_EMAIL: your-email@negocioaldia.app
USDT_ADDRESS: YOUR_USDT_ADDRESS

# Invoice Configuration
INVOICE_COMPANY_NAME: Your Company Name
INVOICE_COMPANY_RIF: J-12345678-9
INVOICE_COMPANY_ADDRESS: Your Address
INVOICE_COMPANY_PHONE: +58-414-1234567

# App Configuration
APP_URL: https://negocioaldia.app
APP_NAME: NAD Scanner - Tu Negocio Al Día
APP_ENV: production

# Security
JWT_SECRET_KEY: YOUR_JWT_SECRET_KEY
JWT_ALGORITHM: HS256
JWT_EXPIRATION_HOURS: 24

# Rate Limiting
RATE_LIMIT_ENABLED: true
RATE_LIMIT_PER_MINUTE: 60
