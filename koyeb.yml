name: nad-scanner-backend
services:
  - name: web
    type: web
    ports:
      - port: 5000
        protocol: http
    build:
      type: dockerfile
      dockerfile: Dockerfile
    env:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GOOGLE_DRIVE_CREDENTIALS
        sync: false
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: PORT
        value: 5000
    health_check:
      http:
        path: /
        port: 5000
