# Render.com deployment configuration for NAD Scanner
# This file configures the build and deployment process

services:
  - type: web
    name: nad-scanner-backend
    runtime: python
    plan: free
    buildCommand: |
      # Install Tesseract OCR
      apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-spa
      # Install Python dependencies
      pip install -r requirements.txt
    startCommand: python web_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 5000
    healthCheckPath: /
